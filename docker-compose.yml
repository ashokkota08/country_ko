services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      OWN_SERVICE_HOST: service-registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DDL_AUTO: update
      EUREKA_HOST: service-registry
      OWN_SERVICE_HOST: product-service
      CLOUDINARY_CLOUD_NAME: your_cloud_name
      CLOUDINARY_API_KEY: your_api_key
      CLOUDINARY_API_SECRET: your_api_secret
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    restart: on-failure:5

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DDL_AUTO: update
      EUREKA_HOST: service-registry
      OWN_SERVICE_HOST: order-service
      KEY_ID: your_razorpay_key_id
      KEY_SECRET: your_razorpay_key_secret
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    restart: on-failure:5

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      db_username: root
      db_password: rootpassword
      EUREKA_HOST: service-registry
      OWN_SERVICE_HOST: api-gateway
      PRODUCTSERVICE_HOST: product-service
      ORDERSERVICE_HOST: order-service
      JWT_SECRET: mySecretKey12345678901234567890123
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    restart: on-failure:5

volumes:
  mysql_data:
